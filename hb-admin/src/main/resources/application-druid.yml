# 数据源配置
spring:
    datasource:
        druid:
            stat-view-servlet:
                enabled: true
                loginUsername: admin
                loginPassword: 123456
        dynamic:
            druid:
                initial-size: 5
                min-idle: 5
                maxActive: 20
                maxWait: 60000
                timeBetweenEvictionRunsMillis: 60000
                minEvictableIdleTimeMillis: 300000
                validationQuery: SELECT 1
                testWhileIdle: true
                testOnBorrow: false
                testOnReturn: false
                poolPreparedStatements: true
                maxPoolPreparedStatementPerConnectionSize: 20
                filters: stat,slf4j
                connectionProperties: druid.stat.mergeSql\=true;druid.stat.slowSqlMillis\=5000
            datasource:
                # 主库数据源（本地 H2 服务器模式：先运行 db/start-h2.bat 启动数据库，再启动后端）
                # 数据库文件固定在项目根 db/history-book.mv.db，由 H2 服务器进程统一管理，数据持久保存
                master:
                    driver-class-name: org.h2.Driver
                    url: jdbc:h2:tcp://localhost:9092/./history-book
                    username: sa
                    password: ''
